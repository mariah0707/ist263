<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10</title>
    <link rel="stylesheet" href="https://laferger.github.io/ist263/images/animate2.css">
<script>
    function Winnermessage() {
    document.getElementById("messages").innerHTML = "You Won!";
    }
    function TryAgain() {
        document.getElementById("messages").innerHTML = "Wrong Shell, Try Again!";
    }
    function ShuffleShells(){
        document.getElementById("first").style.order = Math.floor((Math.random() * 3) + 2);
    }
</script>
<style>
    .container{
            display:flex;
    }
    #first { order:1;}
    #second { order:2;}
    #third { order:3;}
</style>

</head>
<body onload="ShuffleShells();">
    <div class="container">
    <h1>Choose a Walnut</h1>
    <img src="https://laferger.github.io/ist263/images/walnut.png" alt="first walnut" onclick="Winnermessage();" id="first">
    <div id="messages"></div>
    </div>

    <img src="https://laferger.github.io/ist263/images/walnut.png" alt="second walnut" id="second" onclick="TryAgain();">
    <img src="https://laferger.github.io/ist263/images/walnut.png" alt="third walnut" id="third" onclick="TryAgain();">
</body>
</html>
