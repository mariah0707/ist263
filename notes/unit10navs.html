<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
     nav {
        display:flex;
        justify-content:flex-end;
        background-color:lightblue;
        padding:10px;
     }
     nav div{
        padding:10px;
        display:flex;
     }
    .flexend {
        justify-content:flex-end;
    }
    .flexendspacearound {
        justify-content:space-around;
    }
    .flexendspacebetween {
        justify-content:space-between;
    }
    .splittingnav {
        justify-content:space-between;
    }
</style>
</head>
<body>
    <h1>Navigation</h1>

<h2>flex end</h2>
<nav class="flexend">
    
        <div>Home</div>
        <div>About</div>
        <div>Products</div>
        <div>Contact</div>
 </nav>
    
 <h2>flex end space around</h2>
<nav class="flexendspacearound">
    
        <div>Home</div>
        <div>About</div>
        <div>Products</div>
        <div>Contact</div>
 </nav>
    
 <h2>flex end space around</h2>
<nav class="flexendspacebetween">
    
        <div>Home</div>
        <div>About</div>
        <div>Products</div>
        <div>Contact</div>
 </nav>

    <h2>split navigation</h2>
<nav class="splittingnav">
    <div>
            <div>Home</div>
            <div>About</div>
            <div>Products</div>
            <div>Contact</div>
    </div>
    <div>
            <div>Instagram</div>
            <div>Tiktok</div>
    </div>
 </nav>
</body>
</html>
