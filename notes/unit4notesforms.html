<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <h1> This is our 263 Food Delivery Form</h1>
    <form action="" post="">
        <label for="fullname"> Full Name: </label>
        <input type="text" id="fullname" name="fullname">
    <!--the name will show when the form is submitted--> <br>
        <label for="Special"> Special Instructions: </label> 
        <textarea id="Special" name="Special"></textarea> <br>
        <p> Pickup or Delivery</p>
        <input type="radio" id="delivery1" name="delivery" value="Pickup">
        <label for="delivery1"> Pickup</label>
        <p> Pickup or Delivery</p>
        <input type="radio" id="delivery2" name="delivery" value="delivery">
        <label for="delivery2"> Delivery</label> <br>
        <!--unlike radio checkboxes can be unselected-->
            <label for="food"> What Food? </label>
            <select name="food" id="food">
                <option value="Sushi"> Sushi</option>
               <option value="pizza">pizza </option>
                <option value="sandwich">sandwich </option>
                <option value="thai food">thai food </option>
            
        

            </select>
        
        <input type="checkbox" id="utensils" name="untensils" value="no utensils">
        <label for="utensils"> No utensils</label>




       <br> <input type="submit"   value="Send Order"> 
    </form>
